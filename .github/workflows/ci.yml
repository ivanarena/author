name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  AUBE_VERSION: 1.8.0
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        run: |
          for attempt in 1 2 3; do
            npx -y "@endevco/aube@${AUBE_VERSION}" install --frozen-lockfile && exit 0
            sleep_seconds=$((attempt * 20))
            echo "Dependency install failed on attempt ${attempt}; retrying in ${sleep_seconds}s..."
            sleep "${sleep_seconds}"
          done

          npx -y "@endevco/aube@${AUBE_VERSION}" install --frozen-lockfile

      - name: Dependency graph check
        run: npx -y "@endevco/aube@${AUBE_VERSION}" run deps:check

      - name: Dependency audit
        run: |
          npx -y "@endevco/aube@${AUBE_VERSION}" audit --prod
          npx -y "@endevco/aube@${AUBE_VERSION}" audit --audit-level high

      - name: Deprecation check
        run: npx -y "@endevco/aube@${AUBE_VERSION}" deprecations --transitive --exit-code

      - name: Typecheck
        run: npx -y "@endevco/aube@${AUBE_VERSION}" run check

      - name: Format check
        run: npx -y "@endevco/aube@${AUBE_VERSION}" run format:check

      - name: Lint
        run: npx -y "@endevco/aube@${AUBE_VERSION}" run lint

      - name: Unit tests
        run: npx -y "@endevco/aube@${AUBE_VERSION}" run test

      - name: Coverage
        run: npx -y "@endevco/aube@${AUBE_VERSION}" run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: coverage-report
          path: |
            apps/web/coverage
            packages/sync-spec/coverage

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: apps/web

      - name: Browser sync tests
        run: npx -y "@endevco/aube@${AUBE_VERSION}" -F @author/web run test:e2e

      - name: Production build
        run: npx -y "@endevco/aube@${AUBE_VERSION}" run build

      - name: Cloudflare Worker build
        run: npx -y "@endevco/aube@${AUBE_VERSION}" -F @author/web run cf:build

  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Format check
        run: ./gradlew spotlessCheck
        working-directory: apps/android

      - name: Compile and test
        run: ./gradlew :app:compileDebugKotlin :app:testDebugUnitTest :app:assembleDebug
        working-directory: apps/android

      - name: Lint debug
        run: ./gradlew :app:lintDebug
        working-directory: apps/android

      - name: Validate release
        run: ./gradlew :app:lintRelease :app:assembleRelease
        working-directory: apps/android
        env:
          AUTHOR_NOTES_API_URL: https://author.example.invalid

      - name: Upload Android reports
        uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: android-reports
          path: |
            apps/android/app/build/reports
            apps/android/app/build/outputs/androidTest-results

  android-connected:
    name: Android Connected
    runs-on: ubuntu-latest
    needs: android
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Android connected tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: cd apps/android && ./gradlew :app:connectedDebugAndroidTest

      - name: Upload connected test reports
        uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: android-connected-reports
          path: |
            apps/android/app/build/reports
            apps/android/app/build/outputs/androidTest-results
