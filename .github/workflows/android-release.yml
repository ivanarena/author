name: Android Release APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag to build and attach the signed APK to
        required: true
        type: string
  release:
    types:
      - published

permissions:
  actions: read
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}

jobs:
  signed-apk:
    name: Signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}
          fetch-depth: 0

      - name: Validate release source
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::Android release APKs can only be built from commits on main."
            exit 1
          fi

      - name: Validate Android release version
        run: bash scripts/validate-android-release-version.sh "$RELEASE_TAG"

      - name: Require green release gates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_sha="$(git rev-parse HEAD)"

          require_successful_workflow() {
            workflow_name="$1"
            run_url="$(
              gh run list \
                --workflow "$workflow_name" \
                --commit "$release_sha" \
                --limit 20 \
                --json status,conclusion,url,createdAt \
                --jq 'map(select(.status == "completed" and .conclusion == "success")) | sort_by(.createdAt) | reverse | .[0].url // ""'
            )"

            if [ -z "$run_url" ]; then
              echo "::error::No successful ${workflow_name} workflow run found for ${release_sha}."
              exit 1
            fi

            echo "${workflow_name} gate passed: ${run_url}"
          }

          require_successful_workflow "CI"
          require_successful_workflow "Docker"
          require_successful_workflow "Cloudflare Deploy"

      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Validate release configuration
        env:
          AUTHOR_API_URL: ${{ vars.AUTHOR_API_URL }}
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          missing=0
          for name in \
            AUTHOR_API_URL \
            ANDROID_RELEASE_KEYSTORE_BASE64 \
            ANDROID_RELEASE_KEYSTORE_PASSWORD \
            ANDROID_RELEASE_KEY_ALIAS \
            ANDROID_RELEASE_KEY_PASSWORD
          do
            if [ -z "${!name:-}" ]; then
              echo "::error::${name} is not configured"
              missing=1
            fi
          done

          case "${AUTHOR_API_URL:-}" in
            https://*) ;;
            *)
              echo "::error::AUTHOR_API_URL must be an HTTPS URL"
              missing=1
              ;;
          esac

          exit "$missing"

      - name: Restore release keystore
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        run: |
          signing_dir="${RUNNER_TEMP}/android-signing"
          keystore_path="${signing_dir}/author-release.p12"
          mkdir -p "$signing_dir"
          printf '%s' "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 -d > "$keystore_path"
          chmod 600 "$keystore_path"
          echo "ANDROID_RELEASE_KEYSTORE_PATH=$keystore_path" >> "$GITHUB_ENV"

      - name: Build signed release APK
        working-directory: apps/android
        env:
          AUTHOR_API_URL: ${{ vars.AUTHOR_API_URL }}
          ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app:lintRelease :app:assembleRelease

      - name: Verify APK signature
        id: verify
        env:
          APK_PATH: apps/android/app/build/outputs/apk/release/app-release.apk
        run: |
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          "$apksigner" verify --verbose --print-certs "$APK_PATH"
          sha256="$(sha256sum "$APK_PATH" | cut -d ' ' -f 1)"
          echo "apk_sha256=$sha256" >> "$GITHUB_OUTPUT"

      - name: Prepare release asset
        id: asset
        env:
          APK_PATH: apps/android/app/build/outputs/apk/release/app-release.apk
        run: |
          safe_tag="${RELEASE_TAG//\//-}"
          asset_path="${RUNNER_TEMP}/author-${safe_tag}-release-signed.apk"
          cp "$APK_PATH" "$asset_path"
          echo "asset_path=$asset_path" >> "$GITHUB_OUTPUT"
          echo "asset_name=$(basename "$asset_path")" >> "$GITHUB_OUTPUT"

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.asset.outputs.asset_name }}
          path: ${{ steps.asset.outputs.asset_path }}

      - name: Attach signed APK to release
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_PATH: ${{ steps.asset.outputs.asset_path }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$ASSET_PATH" --clobber
          else
            gh release create "$RELEASE_TAG" "$ASSET_PATH" \
              --title "Author ${RELEASE_TAG}" \
              --generate-notes \
              --latest
          fi
