name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npx -y @endevco/aube@1.4.0 install --frozen-lockfile

      - name: Dependency graph check
        run: npx -y @endevco/aube@1.4.0 run deps:check

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: apps/web

      - name: Typecheck
        run: npx -y @endevco/aube@1.4.0 run check

      - name: Format check
        run: npx -y @endevco/aube@1.4.0 run format:check

      - name: Lint
        run: npx -y @endevco/aube@1.4.0 run lint

      - name: Unit tests
        run: npx -y @endevco/aube@1.4.0 run test

      - name: Coverage
        run: npx -y @endevco/aube@1.4.0 run test:coverage

      - name: Android typecheck
        run: ./gradlew :app:compileDebugKotlin
        working-directory: apps/android

      - name: Android lint
        run: ./gradlew :app:lintDebug
        working-directory: apps/android

      - name: Android unit tests
        run: ./gradlew :app:testDebugUnitTest
        working-directory: apps/android

      - name: Android debug build
        run: ./gradlew :app:assembleDebug
        working-directory: apps/android

      - name: Upload coverage report
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: coverage-report
          path: |
            apps/web/coverage
            packages/sync-spec/coverage

      - name: Browser sync tests
        run: npx -y @endevco/aube@1.4.0 -F @author/web run test:e2e

      - name: Production build
        run: npx -y @endevco/aube@1.4.0 run build
