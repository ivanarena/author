name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        run: npx -y @endevco/aube@1.4.0 install

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: apps/web

      - name: Typecheck
        run: npx -y @endevco/aube@1.4.0 run check

      - name: Unit tests
        run: npx -y @endevco/aube@1.4.0 run test

      - name: Browser sync tests
        run: npx -y @endevco/aube@1.4.0 -F @author/web run test:e2e

      - name: Production build
        run: npx -y @endevco/aube@1.4.0 run build
