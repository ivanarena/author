services:
  notes:
    build: .
    image: author:local
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      NOTES_DB_PATH: '${NOTES_DB_PATH:-/data/notes.sqlite}'
      NOTES_LOGIN_USERNAME: '${NOTES_LOGIN_USERNAME:-owner}'
      NOTES_LOGIN_PASSWORD: '${NOTES_LOGIN_PASSWORD:-}'
      NOTES_AUTH_SESSION_DAYS: '${NOTES_AUTH_SESSION_DAYS:-90}'
      NOTES_TRUST_PROXY_HEADERS: '${NOTES_TRUST_PROXY_HEADERS:-false}'
      NOTES_TRUST_CLOUDFLARE_HEADERS: '${NOTES_TRUST_CLOUDFLARE_HEADERS:-false}'
      NOTES_SERVER_SECRET: '${NOTES_SERVER_SECRET:-}'
      NOTES_METRICS_PUBLIC: '${NOTES_METRICS_PUBLIC:-false}'
      NOTES_METRICS_TOKEN: '${NOTES_METRICS_TOKEN:-}'
      NOTES_REMOTE_SYNC_ENABLED: '${NOTES_REMOTE_SYNC_ENABLED:-true}'
      NOTES_SIGNUP_ALLOWED_EMAILS: '${NOTES_SIGNUP_ALLOWED_EMAILS:-}'
      NOTES_CLEANUP_ENABLED: '${NOTES_CLEANUP_ENABLED:-true}'
      NOTES_CLEANUP_RUN_ON_START: '${NOTES_CLEANUP_RUN_ON_START:-true}'
      NOTES_CLEANUP_INTERVAL_MINUTES: '${NOTES_CLEANUP_INTERVAL_MINUTES:-1440}'
      NOTES_BACKUP_ENABLED: '${NOTES_BACKUP_ENABLED:-true}'
      NOTES_BACKUP_RUN_ON_START: '${NOTES_BACKUP_RUN_ON_START:-true}'
      NOTES_BACKUP_INTERVAL_MINUTES: '${NOTES_BACKUP_INTERVAL_MINUTES:-1440}'
      NOTES_BACKUP_RETENTION_COUNT: '${NOTES_BACKUP_RETENTION_COUNT:-14}'
      NOTES_BACKUP_DIR: '${NOTES_BACKUP_DIR:-/data/backups}'
      NOTES_LEGACY_AUTH_TOKEN_ENABLED: '${NOTES_LEGACY_AUTH_TOKEN_ENABLED:-false}'
      NOTES_AUTH_TOKEN: '${NOTES_AUTH_TOKEN:-}'
      TURSO_DATABASE_URL: '${TURSO_DATABASE_URL:-}'
      TURSO_AUTH_TOKEN: '${TURSO_AUTH_TOKEN:-}'
      NOTES_RECORD_LIMITS_ENABLED: '${NOTES_RECORD_LIMITS_ENABLED:-true}'
      NOTES_RECORD_LIMIT_STORAGE_BYTES: '${NOTES_RECORD_LIMIT_STORAGE_BYTES:-5000000000}'
      NOTES_RECORD_LIMIT_SAFETY_RATIO: '${NOTES_RECORD_LIMIT_SAFETY_RATIO:-0.8}'
      NOTES_RECORD_LIMIT_NOTE_BYTES: '${NOTES_RECORD_LIMIT_NOTE_BYTES:-24576}'
      NOTES_RECORD_LIMIT_NOTEBOOK_BYTES: '${NOTES_RECORD_LIMIT_NOTEBOOK_BYTES:-4096}'
    ports:
      - '${BIND_ADDRESS:-127.0.0.1}:${HOST_PORT:-3000}:3000'
    volumes:
      - author-data:/data

volumes:
  author-data:
