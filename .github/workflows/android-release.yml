name: Android Release APK

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Sign a private production candidate or publish the accepted candidate
        required: true
        default: candidate
        type: choice
        options:
          - candidate
          - production
      tag:
        description: Existing version tag required for a production dispatch
        required: false
        type: string

permissions:
  actions: read # Query exact-commit workflow gates.
  contents: read

concurrency:
  group: android-release
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RELEASE_CHANNEL: ${{ inputs.channel }}
  RELEASE_REF: ${{ inputs.channel == 'production' && inputs.tag || 'main' }}
  RELEASE_TAG: ${{ inputs.tag }}

jobs:
  release-gate:
    name: Validate Android release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release-sha: ${{ steps.source.outputs.release_sha }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.RELEASE_REF }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release source
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_sha="$(git rev-parse HEAD)"
          current_main="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"

          if [ "$RELEASE_CHANNEL" = production ]; then
            if [ -z "$RELEASE_TAG" ] || ! git show-ref --verify --quiet "refs/tags/${RELEASE_TAG}"; then
              echo "::error::A production build requires an existing version tag."
              exit 1
            fi
            tag_commit="$(git rev-list -n 1 "refs/tags/${RELEASE_TAG}")"
            if [ "$tag_commit" != "$release_sha" ]; then
              echo "::error::${RELEASE_TAG} does not point at the checked-out commit."
              exit 1
            fi
            comparison_status="$(
              gh api \
                "repos/${GITHUB_REPOSITORY}/compare/${release_sha}...${current_main}" \
                --jq .status
            )"
            if [ "$comparison_status" != ahead ] && [ "$comparison_status" != identical ]; then
              echo "::error::Production APKs can only be built from commits on main."
              exit 1
            fi
          elif [ "$RELEASE_CHANNEL" = candidate ]; then
            if [ "$release_sha" != "$current_main" ]; then
              echo "::error::Private candidate APKs must use the current main commit."
              exit 1
            fi
          else
            echo "::error::Unsupported release channel: ${RELEASE_CHANNEL}"
            exit 1
          fi
          echo "release_sha=$release_sha" >> "$GITHUB_OUTPUT"

      - name: Validate Android release version
        run: |
          if [ "$RELEASE_CHANNEL" = production ]; then
            bash scripts/validate-android-release-version.sh "$RELEASE_TAG"
          else
            bash scripts/validate-android-release-version.sh
          fi

      - name: Require green release jobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_sha="$(git rev-parse HEAD)"
          scripts/require-successful-workflow-jobs.sh \
            "CI" "$release_sha" \
            "Workflow lint" "Web" "Android" "Android Connected"
          scripts/require-successful-workflow-jobs.sh \
            "Security" "$release_sha" \
            "Secret scan" \
            "OpenSSF Scorecard" \
            "CodeQL (javascript-typescript, none)" \
            "CodeQL (java-kotlin, manual)"
          if [ "$RELEASE_CHANNEL" != candidate ]; then
            scripts/require-successful-workflow-jobs.sh \
              "Docker" "$release_sha" "Publish signed image"
            scripts/require-successful-workflow-jobs.sh \
              "Remote Staging Smoke" "$release_sha" "Staging Worker and Turso"
          fi
          if [ "$RELEASE_CHANNEL" = production ]; then
            scripts/require-successful-workflow-jobs.sh \
              "Cloudflare Deploy" "$release_sha" "Deploy Worker"
            scripts/require-successful-workflow-jobs.sh \
              "Android Release APK" "$release_sha" "Signed APK"
          fi

  signed-apk:
    name: Signed APK
    if: inputs.channel == 'candidate'
    runs-on: ubuntu-latest
    needs: release-gate
    environment: staging
    timeout-minutes: 35
    permissions:
      actions: read # Query gates and upload the private artifact.
      contents: read
    outputs:
      asset-name: ${{ steps.asset.outputs.asset_name }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.release-gate.outputs.release-sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: platform-tools build-tools;36.0.0

      - name: Validate release configuration
        env:
          PRODUCTION_AUTHOR_API_URL: ${{ vars.AUTHOR_API_URL || 'https://author.ivannn.workers.dev' }}
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
          ANDROID_RELEASE_CERT_SHA256: ${{ secrets.ANDROID_RELEASE_CERT_SHA256 }}
        run: |
          missing=0
          for name in \
            ANDROID_RELEASE_KEYSTORE_BASE64 \
            ANDROID_RELEASE_KEYSTORE_PASSWORD \
            ANDROID_RELEASE_KEY_ALIAS \
            ANDROID_RELEASE_KEY_PASSWORD \
            ANDROID_RELEASE_CERT_SHA256
          do
            if [ -z "${!name:-}" ]; then
              echo "::error::${name} is not configured"
              missing=1
            fi
          done
          case "$PRODUCTION_AUTHOR_API_URL" in
            https://*) ;;
            *)
              echo "::error::The production author API URL must be configured as HTTPS."
              missing=1
              ;;
          esac
          if [ "$missing" -eq 0 ]; then
            echo "RELEASE_API_URL=$PRODUCTION_AUTHOR_API_URL" >> "$GITHUB_ENV"
          fi
          exit "$missing"

      - name: Download the exact CI-built unsigned APK
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.release-gate.outputs.release-sha }}
        run: |
          artifact_name="android-release-unsigned-${RELEASE_SHA}"
          artifact_dir="$RUNNER_TEMP/android-release-unsigned"
          ci_run_id="$(scripts/download-workflow-artifact.sh \
            CI "$RELEASE_SHA" "$artifact_name" "$artifact_dir")"
          (cd "$artifact_dir" && sha256sum -c author-release-unsigned.apk.sha256)
          test "$(cat "$artifact_dir/source-tree.txt")" = "$(git rev-parse 'HEAD^{tree}')"
          unsigned_apk="$artifact_dir/author-release-unsigned.apk"
          version_name="$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)".*/\1/p' apps/android/app/build.gradle.kts)"
          version_code="$(sed -n 's/^[[:space:]]*versionCode = \([0-9]*\).*/\1/p' apps/android/app/build.gradle.kts)"
          aapt="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n 1)"
          badging="$("$aapt" dump badging "$unsigned_apk")"
          grep -Fq "package: name='com.author' versionCode='${version_code}' versionName='${version_name}'" <<<"$badging"
          unzip -p "$unsigned_apk" 'classes*.dex' | strings > "$RUNNER_TEMP/android-release-strings.txt"
          grep -Fq "$RELEASE_API_URL" "$RUNNER_TEMP/android-release-strings.txt"
          echo "APK_CI_RUN_ID=$ci_run_id" >> "$GITHUB_ENV"
          echo "UNSIGNED_APK_PATH=$unsigned_apk" >> "$GITHUB_ENV"

      - name: Restore release keystore
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        run: |
          signing_dir="$RUNNER_TEMP/android-signing"
          keystore_path="$signing_dir/author-release.p12"
          mkdir -p "$signing_dir"
          printf '%s' "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 -d > "$keystore_path"
          chmod 600 "$keystore_path"
          echo "ANDROID_RELEASE_KEYSTORE_PATH=$keystore_path" >> "$GITHUB_ENV"

      - name: Sign the accepted unsigned APK
        env:
          ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          build_tools="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1 | xargs dirname)"
          "$build_tools/zipalign" -c -P 16 4 "$UNSIGNED_APK_PATH"
          signed_apk="$RUNNER_TEMP/app-release.apk"
          cp "$UNSIGNED_APK_PATH" "$signed_apk"
          "$build_tools/apksigner" sign \
            --ks "$ANDROID_RELEASE_KEYSTORE_PATH" \
            --ks-pass env:ANDROID_RELEASE_KEYSTORE_PASSWORD \
            --ks-key-alias "$ANDROID_RELEASE_KEY_ALIAS" \
            --key-pass env:ANDROID_RELEASE_KEY_PASSWORD \
            "$signed_apk"
          echo "APK_PATH=$signed_apk" >> "$GITHUB_ENV"

      - name: Verify APK signature
        id: verify
        env:
          ANDROID_RELEASE_CERT_SHA256: ${{ secrets.ANDROID_RELEASE_CERT_SHA256 }}
        run: |
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          cert_output="$("$apksigner" verify --verbose --print-certs "$APK_PATH")"
          printf '%s\n' "$cert_output"
          actual_cert="$(printf '%s\n' "$cert_output" | scripts/extract-android-cert-sha256.sh)"
          expected_cert="$(printf '%s' "$ANDROID_RELEASE_CERT_SHA256" | tr '[:upper:]' '[:lower:]' | tr -d ':')"
          if [ -z "$actual_cert" ] || [ "$actual_cert" != "$expected_cert" ]; then
            echo "::error::APK signing certificate does not match ANDROID_RELEASE_CERT_SHA256."
            exit 1
          fi
          sha256="$(sha256sum "$APK_PATH" | cut -d ' ' -f 1)"
          echo "apk_sha256=$sha256" >> "$GITHUB_OUTPUT"
          echo "cert_sha256=$actual_cert" >> "$GITHUB_OUTPUT"

      - name: Prepare release asset
        id: asset
        run: |
          version_name="$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)".*/\1/p' apps/android/app/build.gradle.kts)"
          release_id="v${version_name}-candidate-$(git rev-parse --short=8 HEAD)"
          asset_path="${RUNNER_TEMP}/author-${release_id}-release-signed.apk"
          cp "$APK_PATH" "$asset_path"
          echo "asset_path=$asset_path" >> "$GITHUB_OUTPUT"
          echo "asset_name=$(basename "$asset_path")" >> "$GITHUB_OUTPUT"

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.asset.outputs.asset_name }}
          path: ${{ steps.asset.outputs.asset_path }}
          retention-days: 14

      - name: Record artifact identity
        env:
          APK_SHA256: ${{ steps.verify.outputs.apk_sha256 }}
          CERT_SHA256: ${{ steps.verify.outputs.cert_sha256 }}
          ASSET_NAME: ${{ steps.asset.outputs.asset_name }}
        run: |
          {
            echo '## Android artifact identity'
            echo
            echo "- Channel: \`${RELEASE_CHANNEL}\`"
            echo "- Commit: \`$(git rev-parse HEAD)\`"
            echo "- Artifact: \`${ASSET_NAME}\`"
            echo "- Unsigned APK CI run: \`${APK_CI_RUN_ID}\`"
            echo "- APK SHA-256: \`${APK_SHA256}\`"
            echo "- Certificate SHA-256: \`${CERT_SHA256}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  promote-apk:
    name: Publish production APK
    if: inputs.channel == 'production'
    needs: release-gate
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    permissions:
      actions: read # Download the successful exact-commit candidate artifact.
      contents: write # Create or update the requested GitHub release.
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.release-gate.outputs.release-sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: platform-tools build-tools;36.0.0

      - name: Download the accepted production candidate
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.release-gate.outputs.release-sha }}
        run: |
          version_name="$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)".*/\1/p' apps/android/app/build.gradle.kts)"
          short_sha="$(git rev-parse --short=8 HEAD)"
          candidate_name="author-v${version_name}-candidate-${short_sha}-release-signed.apk"
          artifact_dir="$RUNNER_TEMP/android-candidate"
          candidate_run_id="$(scripts/download-workflow-artifact.sh \
            'Android Release APK' "$RELEASE_SHA" "$candidate_name" "$artifact_dir")"
          candidate_path="${artifact_dir}/${candidate_name}"
          test -f "$candidate_path"
          echo "CANDIDATE_APK_PATH=$candidate_path" >> "$GITHUB_ENV"
          echo "CANDIDATE_RUN_ID=$candidate_run_id" >> "$GITHUB_ENV"

      - name: Verify and name the promoted APK
        id: asset
        env:
          ANDROID_RELEASE_CERT_SHA256: ${{ secrets.ANDROID_RELEASE_CERT_SHA256 }}
        run: |
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          aapt="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n 1)"
          cert_output="$("$apksigner" verify --verbose --print-certs "$CANDIDATE_APK_PATH")"
          printf '%s\n' "$cert_output"
          actual_cert="$(printf '%s\n' "$cert_output" | scripts/extract-android-cert-sha256.sh)"
          expected_cert="$(printf '%s' "$ANDROID_RELEASE_CERT_SHA256" | tr '[:upper:]' '[:lower:]' | tr -d ':')"
          if [ -z "$actual_cert" ] || [ "$actual_cert" != "$expected_cert" ]; then
            echo "::error::Candidate signing certificate does not match ANDROID_RELEASE_CERT_SHA256."
            exit 1
          fi

          expected_version="${RELEASE_TAG#v}"
          actual_version="$(
            "$aapt" dump badging "$CANDIDATE_APK_PATH" |
              sed -n "s/^package:.*versionName='\([^']*\)'.*/\1/p"
          )"
          if [ "$actual_version" != "$expected_version" ]; then
            echo "::error::Candidate version ${actual_version} does not match ${expected_version}."
            exit 1
          fi

          asset_name="author-${RELEASE_TAG}-release-signed.apk"
          asset_path="${RUNNER_TEMP}/${asset_name}"
          cp "$CANDIDATE_APK_PATH" "$asset_path"
          apk_sha256="$(sha256sum "$asset_path" | cut -d ' ' -f 1)"
          {
            echo "asset_name=$asset_name"
            echo "asset_path=$asset_path"
            echo "apk_sha256=$apk_sha256"
            echo "cert_sha256=$actual_cert"
          } >> "$GITHUB_OUTPUT"

      - name: Attach the promoted APK to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ASSET_NAME: ${{ steps.asset.outputs.asset_name }}
          ASSET_PATH: ${{ steps.asset.outputs.asset_path }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$ASSET_PATH" --clobber
          else
            gh release create "$RELEASE_TAG" "$ASSET_PATH" \
              --title "author ${RELEASE_TAG}" \
              --generate-notes \
              --latest
          fi

      - name: Record promoted artifact identity
        env:
          APK_SHA256: ${{ steps.asset.outputs.apk_sha256 }}
          CERT_SHA256: ${{ steps.asset.outputs.cert_sha256 }}
          ASSET_NAME: ${{ steps.asset.outputs.asset_name }}
        run: |
          {
            echo '## Promoted Android artifact identity'
            echo
            echo "- Candidate run: \`${CANDIDATE_RUN_ID}\`"
            echo "- Commit: \`$(git rev-parse HEAD)\`"
            echo "- Artifact: \`${ASSET_NAME}\`"
            echo "- APK SHA-256: \`${APK_SHA256}\`"
            echo "- Certificate SHA-256: \`${CERT_SHA256}\`"
          } >> "$GITHUB_STEP_SUMMARY"
