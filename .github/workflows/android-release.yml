name: Android Release APK

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Build a private staging APK or publish a production APK
        required: true
        default: test
        type: choice
        options:
          - test
          - production
      ref:
        description: Main-branch ref for a private test artifact
        required: true
        default: main
        type: string
      tag:
        description: Existing version tag required for a production dispatch
        required: false
        type: string

permissions:
  actions: read # Query exact-commit workflow gates.
  contents: read

concurrency:
  group: android-release
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RELEASE_CHANNEL: ${{ inputs.channel }}
  RELEASE_REF: ${{ inputs.channel == 'production' && inputs.tag || inputs.ref }}
  RELEASE_TAG: ${{ inputs.tag }}

jobs:
  release-gate:
    name: Validate Android release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release-sha: ${{ steps.source.outputs.release_sha }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.RELEASE_REF }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release source
        id: source
        run: |
          git fetch --tags origin main:refs/remotes/origin/main
          release_sha="$(git rev-parse HEAD)"
          current_main="$(git rev-parse origin/main)"

          if [ "$RELEASE_CHANNEL" = production ]; then
            if [ -z "$RELEASE_TAG" ] || ! git show-ref --verify --quiet "refs/tags/${RELEASE_TAG}"; then
              echo "::error::A production build requires an existing version tag."
              exit 1
            fi
            tag_commit="$(git rev-list -n 1 "refs/tags/${RELEASE_TAG}")"
            if [ "$tag_commit" != "$release_sha" ]; then
              echo "::error::${RELEASE_TAG} does not point at the checked-out commit."
              exit 1
            fi
            if ! git merge-base --is-ancestor HEAD origin/main; then
              echo "::error::Production APKs can only be built from commits on main."
              exit 1
            fi
          elif [ "$RELEASE_CHANNEL" = test ]; then
            if [ "$release_sha" != "$current_main" ]; then
              echo "::error::Private test APKs must use the current main commit."
              exit 1
            fi
          else
            echo "::error::Unsupported release channel: ${RELEASE_CHANNEL}"
            exit 1
          fi
          echo "release_sha=$release_sha" >> "$GITHUB_OUTPUT"

      - name: Validate Android release version
        run: |
          if [ "$RELEASE_CHANNEL" = production ]; then
            bash scripts/validate-android-release-version.sh "$RELEASE_TAG"
          else
            bash scripts/validate-android-release-version.sh
          fi

      - name: Require green release jobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_sha="$(git rev-parse HEAD)"
          scripts/require-successful-workflow-jobs.sh \
            "CI" "$release_sha" \
            "Workflow lint" "Web" "Android" "Android Connected"
          scripts/require-successful-workflow-jobs.sh \
            "Docker" "$release_sha" "Publish signed image"
          scripts/require-successful-workflow-jobs.sh \
            "Security" "$release_sha" \
            "OpenSSF Scorecard" \
            "CodeQL (javascript-typescript, none)" \
            "CodeQL (java-kotlin, manual)"
          scripts/require-successful-workflow-jobs.sh \
            "Remote Staging Smoke" "$release_sha" "Staging Worker and Turso"
          if [ "$RELEASE_CHANNEL" = production ]; then
            scripts/require-successful-workflow-jobs.sh \
              "Cloudflare Deploy" "$release_sha" "Deploy Worker"
          fi

  signed-apk:
    name: Signed APK
    runs-on: ubuntu-latest
    needs: release-gate
    environment: ${{ inputs.channel == 'production' && 'production' || 'staging' }}
    timeout-minutes: 35
    permissions:
      actions: read # Query gates and upload the private artifact.
      contents: read
    outputs:
      asset-name: ${{ steps.asset.outputs.asset_name }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.release-gate.outputs.release-sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Validate release configuration
        env:
          PRODUCTION_AUTHOR_API_URL: ${{ vars.AUTHOR_API_URL }}
          STAGING_AUTHOR_API_URL: ${{ secrets.STAGING_AUTHOR_API_URL }}
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
          ANDROID_RELEASE_CERT_SHA256: ${{ secrets.ANDROID_RELEASE_CERT_SHA256 }}
        run: |
          missing=0
          for name in \
            ANDROID_RELEASE_KEYSTORE_BASE64 \
            ANDROID_RELEASE_KEYSTORE_PASSWORD \
            ANDROID_RELEASE_KEY_ALIAS \
            ANDROID_RELEASE_KEY_PASSWORD \
            ANDROID_RELEASE_CERT_SHA256
          do
            if [ -z "${!name:-}" ]; then
              echo "::error::${name} is not configured"
              missing=1
            fi
          done

          if [ "$RELEASE_CHANNEL" = production ]; then
            release_api_url="${PRODUCTION_AUTHOR_API_URL:-}"
          else
            release_api_url="${STAGING_AUTHOR_API_URL:-}"
          fi
          case "$release_api_url" in
            https://*) ;;
            *)
              echo "::error::The ${RELEASE_CHANNEL} Author API URL must be configured as HTTPS."
              missing=1
              ;;
          esac

          if [ "$missing" -eq 0 ]; then
            echo "RELEASE_API_URL=$release_api_url" >> "$GITHUB_ENV"
          fi
          exit "$missing"

      - name: Restore release keystore
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        run: |
          signing_dir="${RUNNER_TEMP}/android-signing"
          keystore_path="${signing_dir}/author-release.p12"
          mkdir -p "$signing_dir"
          printf '%s' "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 -d > "$keystore_path"
          chmod 600 "$keystore_path"
          echo "ANDROID_RELEASE_KEYSTORE_PATH=$keystore_path" >> "$GITHUB_ENV"

      - name: Build signed release APK
        working-directory: apps/android
        env:
          AUTHOR_API_URL: ${{ env.RELEASE_API_URL }}
          ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app:lintRelease :app:assembleRelease

      - name: Verify APK signature
        id: verify
        env:
          APK_PATH: apps/android/app/build/outputs/apk/release/app-release.apk
          ANDROID_RELEASE_CERT_SHA256: ${{ secrets.ANDROID_RELEASE_CERT_SHA256 }}
        run: |
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          cert_output="$("$apksigner" verify --verbose --print-certs "$APK_PATH")"
          printf '%s\n' "$cert_output"
          actual_cert="$(printf '%s\n' "$cert_output" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1 | tr '[:upper:]' '[:lower:]' | tr -d ':')"
          expected_cert="$(printf '%s' "$ANDROID_RELEASE_CERT_SHA256" | tr '[:upper:]' '[:lower:]' | tr -d ':')"
          if [ -z "$actual_cert" ] || [ "$actual_cert" != "$expected_cert" ]; then
            echo "::error::APK signing certificate does not match ANDROID_RELEASE_CERT_SHA256."
            exit 1
          fi
          sha256="$(sha256sum "$APK_PATH" | cut -d ' ' -f 1)"
          echo "apk_sha256=$sha256" >> "$GITHUB_OUTPUT"
          echo "cert_sha256=$actual_cert" >> "$GITHUB_OUTPUT"

      - name: Prepare release asset
        id: asset
        env:
          APK_PATH: apps/android/app/build/outputs/apk/release/app-release.apk
        run: |
          if [ "$RELEASE_CHANNEL" = production ]; then
            release_id="${RELEASE_TAG//\//-}"
          else
            version_name="$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)".*/\1/p' apps/android/app/build.gradle.kts)"
            release_id="v${version_name}-test-$(git rev-parse --short=8 HEAD)"
          fi
          asset_path="${RUNNER_TEMP}/author-${release_id}-release-signed.apk"
          cp "$APK_PATH" "$asset_path"
          echo "asset_path=$asset_path" >> "$GITHUB_OUTPUT"
          echo "asset_name=$(basename "$asset_path")" >> "$GITHUB_OUTPUT"

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.asset.outputs.asset_name }}
          path: ${{ steps.asset.outputs.asset_path }}
          retention-days: 14

      - name: Record artifact identity
        env:
          APK_SHA256: ${{ steps.verify.outputs.apk_sha256 }}
          CERT_SHA256: ${{ steps.verify.outputs.cert_sha256 }}
          ASSET_NAME: ${{ steps.asset.outputs.asset_name }}
        run: |
          {
            echo '## Android artifact identity'
            echo
            echo "- Channel: \`${RELEASE_CHANNEL}\`"
            echo "- Commit: \`$(git rev-parse HEAD)\`"
            echo "- Artifact: \`${ASSET_NAME}\`"
            echo "- APK SHA-256: \`${APK_SHA256}\`"
            echo "- Certificate SHA-256: \`${CERT_SHA256}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  publish-apk:
    name: Publish production APK
    if: inputs.channel == 'production'
    needs: signed-apk
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read # Download the signed artifact from this workflow run.
      contents: write # Create or update the requested GitHub release.
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ needs.signed-apk.outputs.asset-name }}
          path: ${{ runner.temp }}/android-release

      - name: Attach signed APK to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ASSET_NAME: ${{ needs.signed-apk.outputs.asset-name }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          asset_path="${RUNNER_TEMP}/android-release/${ASSET_NAME}"
          test -f "$asset_path"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$asset_path" --clobber
          else
            gh release create "$RELEASE_TAG" "$asset_path" \
              --title "Author ${RELEASE_TAG}" \
              --generate-notes \
              --latest
          fi
