name: Docker

on:
  pull_request:
  workflow_run:
    workflows:
      - CI
    branches:
      - main
    types:
      - completed

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  TRIVY_VERSION: 0.70.0

jobs:
  scan:
    name: Scan image
    runs-on: ubuntu-latest
    timeout-minutes: 35
    if: >-
      ${{
        github.event_name == 'pull_request' ||
        (github.event_name == 'workflow_run' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'main')
      }}
    env:
      IMAGE_REF: ghcr.io/${{ github.repository }}:sha-${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Refuse stale CI result
        if: github.event_name == 'workflow_run'
        run: |
          git fetch --no-tags --depth=1 origin main
          current_main="$(git rev-parse origin/main)"
          if [ "$current_main" != "${{ github.event.workflow_run.head_sha }}" ]; then
            echo "::error::CI completed for ${{ github.event.workflow_run.head_sha }}, but main is now ${current_main}."
            exit 1
          fi

      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        id: build-for-scan
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE_REF }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy
        run: |
          mkdir -p "${HOME}/.cache/trivy"

          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${PWD}:/work" \
            -v "${HOME}/.cache/trivy:/root/.cache" \
            -v "${HOME}/.docker:/root/.docker:ro" \
            "aquasec/trivy:${TRIVY_VERSION}" image \
            --image-src docker \
            --format sarif \
            --output /work/trivy-results.sarif \
            --scanners vuln \
            --severity CRITICAL,HIGH \
            --pkg-types os,library \
            --exit-code 1 \
            --timeout 10m \
            "${IMAGE_REF}"

      - name: Upload scan artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && hashFiles('trivy-results.sarif') != ''
        with:
          name: trivy-results
          path: trivy-results.sarif

  publish:
    name: Publish signed image
    runs-on: ubuntu-latest
    needs: scan
    timeout-minutes: 35
    if: >-
      ${{
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main'
      }}
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      IMAGE_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.IMAGE_SHA }}

      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        id: publish
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:main
            ghcr.io/${{ github.repository }}:sha-${{ env.IMAGE_SHA }}
          sbom: true
          provenance: true
          cache-from: type=gha

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image
        run: cosign sign --yes ghcr.io/${{ github.repository }}@${{ steps.publish.outputs.digest }}
