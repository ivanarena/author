services:
  notes:
    build: .
    image: author:local
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    env_file:
      - .env
    ports:
      - '${BIND_ADDRESS:-127.0.0.1}:${PORT:-3000}:3000'
    volumes:
      - author-data:/data

volumes:
  author-data:
