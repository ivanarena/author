name: Docker

on:
  pull_request:
  workflow_run:
    workflows:
      - CI
    branches:
      - main
    types:
      - completed

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  TRIVY_VERSION: 0.70.0

jobs:
  scan:
    name: Scan image
    runs-on: ubuntu-latest
    if: >-
      ${{
        github.event_name == 'pull_request' ||
        (github.event_name == 'workflow_run' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'main')
      }}
    env:
      IMAGE_REF: ghcr.io/${{ github.repository }}:sha-${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        id: build-for-scan
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE_REF }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy
        run: |
          mkdir -p "${HOME}/.cache/trivy"

          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${PWD}:/work" \
            -v "${HOME}/.cache/trivy:/root/.cache" \
            -v "${HOME}/.docker:/root/.docker:ro" \
            "aquasec/trivy:${TRIVY_VERSION}" image \
            --image-src docker \
            --format sarif \
            --output /work/trivy-results.sarif \
            --scanners vuln \
            --severity CRITICAL,HIGH \
            --pkg-types os,library \
            --exit-code 1 \
            --timeout 10m \
            "${IMAGE_REF}"

      - name: Upload scan artifact
        uses: actions/upload-artifact@v5
        if: always() && hashFiles('trivy-results.sarif') != ''
        with:
          name: trivy-results
          path: trivy-results.sarif

  publish:
    name: Publish signed image
    runs-on: ubuntu-latest
    needs: scan
    if: >-
      ${{
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main'
      }}
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      IMAGE_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.IMAGE_SHA }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        id: publish
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:main
            ghcr.io/${{ github.repository }}:sha-${{ env.IMAGE_SHA }}
          sbom: true
          provenance: true
          cache-from: type=gha

      - uses: sigstore/cosign-installer@v4.1.2

      - name: Sign image
        run: cosign sign --yes ghcr.io/${{ github.repository }}@${{ steps.publish.outputs.digest }}
