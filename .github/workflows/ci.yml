name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  ACTIONLINT_VERSION: v1.7.12
  AUBE_VERSION: 1.16.0
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read # Allow online workflow-audit checks for this repository.
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: stable
          cache: false

      - name: Actionlint
        run: go run "github.com/rhysd/actionlint/cmd/actionlint@${ACTIONLINT_VERSION}"

      - name: Release workflow gate regressions
        run: |
          scripts/test-release-workflow-gates.sh
          scripts/test-android-cert-parser.sh

      - name: Audit workflows with zizmor
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          advanced-security: false
          inputs: .github/workflows
          persona: pedantic
          version: 1.29.0

  web_build:
    name: Web build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - name: Install dependencies
        run: |
          for attempt in 1 2 3; do
            npx -y "@endevco/aube@${AUBE_VERSION}" install --frozen-lockfile && exit 0
            sleep_seconds=$((attempt * 20))
            echo "Dependency install failed on attempt ${attempt}; retrying in ${sleep_seconds}s..."
            sleep "${sleep_seconds}"
          done

          npx -y "@endevco/aube@${AUBE_VERSION}" install --frozen-lockfile

      - name: Toolchain check
        run: npx -y "@endevco/aube@${AUBE_VERSION}" run toolchain:check

      - name: Dependency graph check
        run: npx -y "@endevco/aube@${AUBE_VERSION}" run deps:check

      - name: Dependency audit
        run: |
          npx -y "@endevco/aube@${AUBE_VERSION}" audit --prod
          npx -y "@endevco/aube@${AUBE_VERSION}" audit --audit-level high

      - name: Deprecation check
        run: npx -y "@endevco/aube@${AUBE_VERSION}" deprecations --transitive --exit-code

      - name: Typecheck
        run: npx -y "@endevco/aube@${AUBE_VERSION}" run check

      - name: Format check
        run: npx -y "@endevco/aube@${AUBE_VERSION}" run format:check

      - name: Lint
        run: npx -y "@endevco/aube@${AUBE_VERSION}" run lint

      # Coverage executes the complete unit/spec suite, so do not run it twice.
      - name: Coverage
        run: npx -y "@endevco/aube@${AUBE_VERSION}" run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: coverage-report
          path: |
            apps/web/coverage
            packages/sync-spec/coverage

      - name: Production build
        run: npx -y "@endevco/aube@${AUBE_VERSION}" run build

      - name: Cloudflare Worker build
        run: npx -y "@endevco/aube@${AUBE_VERSION}" -F @author/web run cf:build

      - name: Package immutable Cloudflare Worker bundle
        run: |
          code_dir="${RUNNER_TEMP}/cloudflare-worker-code"
          bundle_dir="${RUNNER_TEMP}/cloudflare-worker-bundle"
          archive="${RUNNER_TEMP}/cloudflare-worker.tar.gz"
          (
            cd apps/web
            ./node_modules/.bin/wrangler deploy \
              --config wrangler.jsonc \
              --dry-run \
              --outdir "$code_dir"
          )

          mkdir -p "$bundle_dir/code" "$bundle_dir/assets"
          cp "$code_dir/_worker.js" "$bundle_dir/code/_worker.js"
          cp -a apps/web/.svelte-kit/cloudflare/. "$bundle_dir/assets/"
          rm -f \
            "$bundle_dir/assets/_worker.js" \
            "$bundle_dir/assets/_worker.generated.js"
          tar -C "$RUNNER_TEMP" -czf "$archive" cloudflare-worker-bundle
          (
            cd "$RUNNER_TEMP"
            sha256sum cloudflare-worker.tar.gz > cloudflare-worker.tar.gz.sha256
          )
          bundle_sha="$(sha256sum "$archive" | cut -d ' ' -f 1)"
          {
            echo '## Cloudflare Worker artifact'
            echo
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- SHA-256: \`${bundle_sha}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Cloudflare Worker bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cloudflare-worker-${{ github.sha }}
          path: |
            ${{ runner.temp }}/cloudflare-worker.tar.gz
            ${{ runner.temp }}/cloudflare-worker.tar.gz.sha256
          retention-days: 14

  web_e2e:
    name: Web E2E (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: chromium
            browser: chromium
          - project: firefox
            browser: firefox
          - project: webkit
            browser: webkit
          - project: mobile-chromium
            browser: chromium
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - name: Install dependencies
        run: |
          for attempt in 1 2 3; do
            npx -y "@endevco/aube@${AUBE_VERSION}" install --frozen-lockfile && exit 0
            sleep_seconds=$((attempt * 20))
            echo "Dependency install failed on attempt ${attempt}; retrying in ${sleep_seconds}s..."
            sleep "${sleep_seconds}"
          done

          npx -y "@endevco/aube@${AUBE_VERSION}" install --frozen-lockfile

      - name: Install Playwright browser
        env:
          PLAYWRIGHT_BROWSER: ${{ matrix.browser }}
        run: npx -y "@endevco/aube@${AUBE_VERSION}" -F @author/web exec -- playwright install --with-deps "$PLAYWRIGHT_BROWSER"
        timeout-minutes: 20

      - name: Browser sync tests
        env:
          PLAYWRIGHT_PROJECT: ${{ matrix.project }}
        run: npx -y "@endevco/aube@${AUBE_VERSION}" -F @author/web exec -- playwright test --project="$PLAYWRIGHT_PROJECT"
        timeout-minutes: 15

      - name: Upload browser failure report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-${{ matrix.project }}-report
          path: |
            apps/web/playwright-report
            apps/web/test-results

  web:
    name: Web
    runs-on: ubuntu-latest
    if: always()
    needs:
      - web_build
      - web_e2e
    steps:
      - name: Verify Web jobs
        env:
          WEB_BUILD_RESULT: ${{ needs.web_build.result }}
          WEB_E2E_RESULT: ${{ needs.web_e2e.result }}
        run: |
          test "$WEB_BUILD_RESULT" = success
          test "$WEB_E2E_RESULT" = success

  android_debug:
    name: Android debug
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: platform-tools # Avoid the action's obsolete default `tools` package.

      - name: Format check
        run: ./gradlew spotlessCheck
        working-directory: apps/android

      - name: Compile, test, assemble, and lint debug
        run: ./gradlew :app:compileDebugKotlin :app:testDebugUnitTest :app:assembleDebug :app:lintDebug
        working-directory: apps/android

      - name: Upload Android debug reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: android-debug-reports
          path: apps/android/app/build/reports

  android_release:
    name: Android release validation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: platform-tools # Avoid the action's obsolete default `tools` package.

      - name: Lint and assemble release
        run: ./gradlew :app:lintRelease :app:assembleRelease
        working-directory: apps/android
        env:
          AUTHOR_API_URL: https://author.example.invalid

      - name: Upload Android release reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: android-release-reports
          path: apps/android/app/build/reports

  android:
    name: Android
    runs-on: ubuntu-latest
    if: always()
    needs:
      - android_debug
      - android_release
    steps:
      - name: Verify Android jobs
        env:
          ANDROID_DEBUG_RESULT: ${{ needs.android_debug.result }}
          ANDROID_RELEASE_RESULT: ${{ needs.android_release.result }}
        run: |
          test "$ANDROID_DEBUG_RESULT" = success
          test "$ANDROID_RELEASE_RESULT" = success

  android-connected:
    name: Android Connected
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: platform-tools # Avoid the action's obsolete default `tools` package.

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Android connected tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: cd apps/android && ./gradlew :app:connectedDebugAndroidTest

      - name: Upload connected test reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: android-connected-reports
          path: |
            apps/android/app/build/reports
            apps/android/app/build/outputs/androidTest-results
