name: Docker

on:
  workflow_dispatch:
  pull_request:

permissions:
  actions: read # Query CI and transfer the scanned image artifact.
  contents: read

concurrency:
  group: docker-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  TRIVY_IMAGE: aquasec/trivy@sha256:be1190afcb28352bfddc4ddeb71470835d16462af68d310f9f4bca710961a41e # 0.70.0

jobs:
  scan:
    name: Scan image
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      IMAGE_REF: ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Validate publish source
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Docker publication must be dispatched from main, not $GITHUB_REF."
            exit 1
          fi

      - name: Require green CI and Security jobs before a publishable build
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          image_sha="$(git rev-parse HEAD)"
          scripts/require-successful-workflow-jobs.sh \
            "CI" "$image_sha" \
            "Workflow lint" "Web" "Android" "Android Connected"
          scripts/require-successful-workflow-jobs.sh \
            "Security" "$image_sha" \
            "OpenSSF Scorecard" \
            "CodeQL (javascript-typescript, none)" \
            "CodeQL (java-kotlin, manual)"

      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        id: build-for-scan
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE_REF }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export image for scanning and publication
        run: docker save --output author-scanned-image.tar "${IMAGE_REF}"

      - name: Run Trivy
        run: |
          mkdir -p "${HOME}/.cache/trivy"

          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -v "${PWD}:/work" \
            -v "${HOME}/.cache/trivy:/tmp/.cache" \
            "${TRIVY_IMAGE}" image \
            --input /work/author-scanned-image.tar \
            --format sarif \
            --output /work/trivy-results.sarif \
            --scanners vuln \
            --severity CRITICAL,HIGH \
            --pkg-types os,library \
            --exit-code 1 \
            --timeout 10m

      - name: Upload scan artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && hashFiles('trivy-results.sarif') != ''
        with:
          name: trivy-results
          path: trivy-results.sarif

      - name: Upload the scanned image
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: author-scanned-image
          path: author-scanned-image.tar
          compression-level: 0
          retention-days: 1

  publish:
    name: Publish signed image
    runs-on: ubuntu-latest
    needs: scan
    timeout-minutes: 35
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    permissions:
      actions: read # Download the scanned image from this workflow run.
      contents: read
      packages: write # Publish the exact scanned image to GHCR.
      id-token: write # Request keyless Cosign and attestation identities.
      attestations: write # Publish provenance and SBOM attestations.
    env:
      IMAGE_REPOSITORY: ghcr.io/${{ github.repository }}
      IMAGE_SHA: ${{ github.sha }}
    steps:
      - name: Refuse a stale main commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current_main="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          if [ "$current_main" != "$IMAGE_SHA" ]; then
            echo "::error::Image commit ${IMAGE_SHA} is stale; main is now ${current_main}."
            exit 1
          fi

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: author-scanned-image
          path: .

      - name: Load scanned image
        run: docker load --input author-scanned-image.tar

      - uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish scanned immutable image
        id: publish
        run: |
          image_ref="${IMAGE_REPOSITORY}:sha-${IMAGE_SHA}"
          if inspect_error="$(docker manifest inspect "$image_ref" 2>&1)"; then
            echo "::error::Immutable commit image already exists: $image_ref"
            exit 1
          elif ! grep -Eiq 'manifest unknown|no such manifest' <<<"$inspect_error"; then
            echo "::error::Could not verify that immutable commit image is absent: $image_ref"
            echo "$inspect_error" >&2
            exit 1
          fi
          docker push "$image_ref"
          digest="$(docker inspect --format '{{index .RepoDigests 0}}' "$image_ref" | sed 's/.*@//')"
          test -n "$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Generate image SBOM
        uses: anchore/sbom-action@a930d0ac434e3182448fe678398ba5713717112a # v0.21.0
        with:
          image: ghcr.io/${{ github.repository }}@${{ steps.publish.outputs.digest }}
          format: spdx-json
          output-file: author-image.spdx.json
          upload-artifact: true

      - name: Attest image provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true

      - name: Attest image SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          sbom-path: author-image.spdx.json
          push-to-registry: true

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image
        env:
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
        run: cosign sign --yes "${IMAGE_REPOSITORY}@${IMAGE_DIGEST}"

      - name: Promote current commit to the main image tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current_main="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          if [ "$current_main" != "$IMAGE_SHA" ]; then
            echo "::error::Refusing to move the main image tag: ${IMAGE_SHA} is stale; main is ${current_main}."
            exit 1
          fi
          image_ref="${IMAGE_REPOSITORY}:sha-${IMAGE_SHA}"
          docker tag "$image_ref" "${IMAGE_REPOSITORY}:main"
          docker push "${IMAGE_REPOSITORY}:main"
