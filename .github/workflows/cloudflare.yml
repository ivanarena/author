name: Cloudflare Deploy

on:
  workflow_dispatch:

permissions:
  actions: read # Query exact-commit release-candidate workflow gates.
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  WRANGLER_VERSION: 4.123.0

jobs:
  release-gate:
    name: Validate production release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Validate deployment source
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Production deployment must be dispatched from main, not $GITHUB_REF."
            exit 1
          fi

      - name: Require green release-candidate jobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          deploy_sha="$(git rev-parse HEAD)"
          scripts/require-successful-workflow-jobs.sh \
            "CI" "$deploy_sha" \
            "Workflow lint" "Web" "Android" "Android Connected"
          scripts/require-successful-workflow-jobs.sh \
            "Docker" "$deploy_sha" "Publish signed image"
          scripts/require-successful-workflow-jobs.sh \
            "Security" "$deploy_sha" \
            "Secret scan" \
            "OpenSSF Scorecard" \
            "CodeQL (javascript-typescript, none)" \
            "CodeQL (java-kotlin, manual)"
          scripts/require-successful-workflow-jobs.sh \
            "Remote Staging Smoke" "$deploy_sha" "Staging Worker and Turso"

  deploy:
    name: Deploy Worker
    runs-on: ubuntu-latest
    needs: release-gate
    environment: production
    timeout-minutes: 30
    permissions:
      actions: read # Query exact-commit release-candidate workflow gates.
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - name: Refuse a stale main commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          deploy_sha="$(git rev-parse HEAD)"
          current_main="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          if [ "$deploy_sha" != "$current_main" ]; then
            echo "::error::Refusing to deploy stale commit ${deploy_sha}; main is ${current_main}."
            exit 1
          fi

      - name: Download the exact CI-built Worker bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          deploy_sha="$(git rev-parse HEAD)"
          artifact_name="cloudflare-worker-${deploy_sha}"
          artifact_dir="$RUNNER_TEMP/cloudflare-worker-artifact"
          ci_run_id="$(scripts/download-workflow-artifact.sh \
            CI "$deploy_sha" "$artifact_name" "$artifact_dir")"
          (cd "$artifact_dir" && sha256sum -c cloudflare-worker.tar.gz.sha256)
          test "$(cat "$artifact_dir/cloudflare-worker.tree")" = "$(git rev-parse 'HEAD^{tree}')"
          bundle_sha="$(sha256sum "$artifact_dir/cloudflare-worker.tar.gz" | cut -d ' ' -f 1)"

          bundle_root="$RUNNER_TEMP/cloudflare-worker-bundle"
          mkdir -p "$bundle_root"
          tar -xzf "$artifact_dir/cloudflare-worker.tar.gz" -C "$bundle_root"
          bundle_dir="$bundle_root/cloudflare-worker-bundle"
          test -f "$bundle_dir/code/_worker.js"
          test -d "$bundle_dir/assets"
          {
            echo "WORKER_BUNDLE_DIR=$bundle_dir"
            echo "WORKER_BUNDLE_SHA=$bundle_sha"
            echo "WORKER_CI_RUN_ID=$ci_run_id"
          } >> "$GITHUB_ENV"

      - name: Validate deployment secrets
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          NOTES_LOGIN_PASSWORD: ${{ secrets.NOTES_LOGIN_PASSWORD }}
          NOTES_SERVER_SECRET: ${{ secrets.NOTES_SERVER_SECRET }}
          NOTES_METRICS_TOKEN: ${{ secrets.NOTES_METRICS_TOKEN }}
        run: |
          node <<'NODE'
          const required = [
            'CLOUDFLARE_ACCOUNT_ID',
            'CLOUDFLARE_API_TOKEN',
            'TURSO_DATABASE_URL',
            'TURSO_AUTH_TOKEN',
            'NOTES_LOGIN_PASSWORD',
            'NOTES_SERVER_SECRET',
            'NOTES_METRICS_TOKEN'
          ];
          const missing = required.filter((name) => !process.env[name]);
          if (missing.length > 0) {
            console.error(`Missing required GitHub secrets: ${missing.join(', ')}`);
            process.exit(1);
          }
          NODE

      - name: Deploy to Cloudflare Workers
        working-directory: apps/web
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          NOTES_LOGIN_PASSWORD: ${{ secrets.NOTES_LOGIN_PASSWORD }}
          NOTES_SERVER_SECRET: ${{ secrets.NOTES_SERVER_SECRET }}
          NOTES_AUTH_SESSION_DAYS: ${{ secrets.NOTES_AUTH_SESSION_DAYS }}
          NOTES_METRICS_TOKEN: ${{ secrets.NOTES_METRICS_TOKEN }}
          NOTES_RECORD_LIMITS_ENABLED: ${{ secrets.NOTES_RECORD_LIMITS_ENABLED }}
          NOTES_RECORD_LIMIT_STORAGE_BYTES: ${{ secrets.NOTES_RECORD_LIMIT_STORAGE_BYTES }}
          NOTES_RECORD_LIMIT_SAFETY_RATIO: ${{ secrets.NOTES_RECORD_LIMIT_SAFETY_RATIO }}
          NOTES_RECORD_LIMIT_NOTE_BYTES: ${{ secrets.NOTES_RECORD_LIMIT_NOTE_BYTES }}
          NOTES_RECORD_LIMIT_NOTEBOOK_BYTES: ${{ secrets.NOTES_RECORD_LIMIT_NOTEBOOK_BYTES }}
          NOTES_SIGNUP_ALLOWED_EMAILS: ${{ secrets.NOTES_SIGNUP_ALLOWED_EMAILS }}
          AUTHOR_API_URL: ${{ secrets.AUTHOR_API_URL }}
          GH_TOKEN: ${{ github.token }}
        run: |
          deploy_sha="$(git rev-parse HEAD)"
          current_main="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          if [ "$deploy_sha" != "$current_main" ]; then
            echo "::error::Refusing to deploy stale commit ${deploy_sha}; main is ${current_main}."
            exit 1
          fi

          node <<'NODE'
          const fs = require('node:fs');

          const required = [
            'TURSO_DATABASE_URL',
            'TURSO_AUTH_TOKEN',
            'NOTES_LOGIN_PASSWORD',
            'NOTES_SERVER_SECRET',
            'NOTES_METRICS_TOKEN'
          ];
          const optional = [
            'NOTES_AUTH_SESSION_DAYS',
            'NOTES_RECORD_LIMITS_ENABLED',
            'NOTES_RECORD_LIMIT_STORAGE_BYTES',
            'NOTES_RECORD_LIMIT_SAFETY_RATIO',
            'NOTES_RECORD_LIMIT_NOTE_BYTES',
            'NOTES_RECORD_LIMIT_NOTEBOOK_BYTES',
            'NOTES_SIGNUP_ALLOWED_EMAILS',
            'AUTHOR_API_URL'
          ];

          const secrets = {};
          for (const name of [...required, ...optional]) {
            if (process.env[name]) secrets[name] = process.env[name];
          }
          fs.writeFileSync('.worker-secrets.json', JSON.stringify(secrets));
          NODE

          trap 'rm -f .worker-secrets.json' EXIT
          npx -y "wrangler@${WRANGLER_VERSION}" deploy \
            "${WORKER_BUNDLE_DIR}/code/_worker.js" \
            --config wrangler.jsonc \
            --no-bundle \
            --assets "${WORKER_BUNDLE_DIR}/assets" \
            --secrets-file .worker-secrets.json
          {
            echo '## Promoted Cloudflare Worker artifact'
            echo
            echo "- Commit: \`${deploy_sha}\`"
            echo "- CI run: \`${WORKER_CI_RUN_ID}\`"
            echo "- Bundle SHA-256: \`${WORKER_BUNDLE_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"
