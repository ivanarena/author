name: Feature proposal
description: Propose a focused improvement within author's product scope
title: '[Proposal]: '
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        author intentionally stays a plain-text, offline-first notes app. Blocks, rich-text storage, Markdown rendering, public sharing, and collaboration are out of scope unless the project direction changes explicitly.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or operator problem needs to be solved?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the smallest useful change.
    validations:
      required: true
  - type: textarea
    id: offline
    attributes:
      label: Offline-first and data-safety impact
      description: Explain effects on local writes, sync, conflicts, encryption, migration, or backups.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and pull requests.
          required: true
        - label: The proposal preserves plain-text, local-first editing or explains why product direction should change.
          required: true
