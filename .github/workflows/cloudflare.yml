name: Cloudflare Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cloudflare.yml
      - apps/web/**
      - packages/**
      - package.json
      - aube-lock.yaml
      - aube-workspace.yaml

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

env:
  AUBE_VERSION: 1.8.0
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    name: Deploy Worker
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        run: |
          for attempt in 1 2 3; do
            npx -y "@endevco/aube@${AUBE_VERSION}" install --frozen-lockfile && exit 0
            sleep_seconds=$((attempt * 20))
            echo "Dependency install failed on attempt ${attempt}; retrying in ${sleep_seconds}s..."
            sleep "${sleep_seconds}"
          done

          npx -y "@endevco/aube@${AUBE_VERSION}" install --frozen-lockfile

      - name: Dependency graph check
        run: npx -y "@endevco/aube@${AUBE_VERSION}" run deps:check

      - name: Quality gate
        run: npx -y "@endevco/aube@${AUBE_VERSION}" run quality

      - name: Unit tests
        run: npx -y "@endevco/aube@${AUBE_VERSION}" run test

      - name: Cloudflare Worker build
        run: npx -y "@endevco/aube@${AUBE_VERSION}" -F @author/web run cf:build

      - name: Validate deployment secrets
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          NOTES_LOGIN_PASSWORD: ${{ secrets.NOTES_LOGIN_PASSWORD }}
          NOTES_SERVER_SECRET: ${{ secrets.NOTES_SERVER_SECRET }}
        run: |
          node <<'NODE'
          const required = [
            'CLOUDFLARE_ACCOUNT_ID',
            'CLOUDFLARE_API_TOKEN',
            'TURSO_DATABASE_URL',
            'TURSO_AUTH_TOKEN',
            'NOTES_LOGIN_PASSWORD',
            'NOTES_SERVER_SECRET'
          ];
          const missing = required.filter((name) => !process.env[name]);
          if (missing.length > 0) {
            console.error(`Missing required GitHub secrets: ${missing.join(', ')}`);
            process.exit(1);
          }
          NODE

      - name: Sync Worker secrets
        working-directory: apps/web
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          NOTES_LOGIN_PASSWORD: ${{ secrets.NOTES_LOGIN_PASSWORD }}
          NOTES_SERVER_SECRET: ${{ secrets.NOTES_SERVER_SECRET }}
          NOTES_AUTH_SESSION_DAYS: ${{ secrets.NOTES_AUTH_SESSION_DAYS }}
          NOTES_METRICS_TOKEN: ${{ secrets.NOTES_METRICS_TOKEN }}
          NOTES_SIGNUP_ALLOWED_EMAILS: ${{ secrets.NOTES_SIGNUP_ALLOWED_EMAILS }}
          AUTHOR_API_URL: ${{ secrets.AUTHOR_API_URL }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const required = [
            'TURSO_DATABASE_URL',
            'TURSO_AUTH_TOKEN',
            'NOTES_LOGIN_PASSWORD',
            'NOTES_SERVER_SECRET'
          ];
          const optional = [
            'NOTES_AUTH_SESSION_DAYS',
            'NOTES_METRICS_TOKEN',
            'NOTES_SIGNUP_ALLOWED_EMAILS',
            'AUTHOR_API_URL'
          ];

          const secrets = {};
          for (const name of [...required, ...optional]) {
            if (process.env[name]) secrets[name] = process.env[name];
          }
          fs.writeFileSync('.worker-secrets.json', JSON.stringify(secrets));
          NODE

          trap 'rm -f .worker-secrets.json' EXIT
          ./node_modules/.bin/wrangler secret bulk .worker-secrets.json

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx -y "@endevco/aube@${AUBE_VERSION}" -F @author/web run cf:deploy
