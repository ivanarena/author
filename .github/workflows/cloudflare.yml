name: Cloudflare Deploy

on:
  workflow_dispatch:

permissions:
  actions: read # Query exact-commit release-candidate workflow gates.
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

env:
  AUBE_VERSION: 1.16.0
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    name: Deploy Worker
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    if: ${{ github.ref == 'refs/heads/main' }}
    permissions:
      actions: read # Query exact-commit release-candidate workflow gates.
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Require green release-candidate workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          deploy_sha="$(git rev-parse HEAD)"

          require_successful_workflow() {
            workflow_name="$1"
            run_url="$(
              gh run list \
                --workflow "$workflow_name" \
                --commit "$deploy_sha" \
                --limit 20 \
                --json status,conclusion,url,createdAt \
                --jq 'map(select(.status == "completed" and .conclusion == "success")) | sort_by(.createdAt) | reverse | .[0].url // ""'
            )"
            if [ -z "$run_url" ]; then
              echo "::error::No successful ${workflow_name} workflow run exists for ${deploy_sha}."
              exit 1
            fi
            echo "${workflow_name} gate passed: ${run_url}"
          }

          require_successful_workflow "CI"
          require_successful_workflow "Docker"
          require_successful_workflow "Security"
          require_successful_workflow "Remote Staging Smoke"

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - name: Install dependencies
        run: |
          for attempt in 1 2 3; do
            npx -y "@endevco/aube@${AUBE_VERSION}" install --frozen-lockfile && exit 0
            sleep_seconds=$((attempt * 20))
            echo "Dependency install failed on attempt ${attempt}; retrying in ${sleep_seconds}s..."
            sleep "${sleep_seconds}"
          done

          npx -y "@endevco/aube@${AUBE_VERSION}" install --frozen-lockfile

      - name: Toolchain check
        run: npx -y "@endevco/aube@${AUBE_VERSION}" run toolchain:check

      - name: Dependency graph check
        run: npx -y "@endevco/aube@${AUBE_VERSION}" run deps:check

      - name: Quality gate
        run: npx -y "@endevco/aube@${AUBE_VERSION}" run quality

      - name: Unit tests
        run: npx -y "@endevco/aube@${AUBE_VERSION}" run test

      - name: Cloudflare Worker build
        run: npx -y "@endevco/aube@${AUBE_VERSION}" -F @author/web run cf:build

      - name: Validate deployment secrets
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          NOTES_LOGIN_PASSWORD: ${{ secrets.NOTES_LOGIN_PASSWORD }}
          NOTES_SERVER_SECRET: ${{ secrets.NOTES_SERVER_SECRET }}
          NOTES_METRICS_TOKEN: ${{ secrets.NOTES_METRICS_TOKEN }}
        run: |
          node <<'NODE'
          const required = [
            'CLOUDFLARE_ACCOUNT_ID',
            'CLOUDFLARE_API_TOKEN',
            'TURSO_DATABASE_URL',
            'TURSO_AUTH_TOKEN',
            'NOTES_LOGIN_PASSWORD',
            'NOTES_SERVER_SECRET',
            'NOTES_METRICS_TOKEN'
          ];
          const missing = required.filter((name) => !process.env[name]);
          if (missing.length > 0) {
            console.error(`Missing required GitHub secrets: ${missing.join(', ')}`);
            process.exit(1);
          }
          NODE

      - name: Deploy to Cloudflare Workers
        working-directory: apps/web
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          NOTES_LOGIN_PASSWORD: ${{ secrets.NOTES_LOGIN_PASSWORD }}
          NOTES_SERVER_SECRET: ${{ secrets.NOTES_SERVER_SECRET }}
          NOTES_AUTH_SESSION_DAYS: ${{ secrets.NOTES_AUTH_SESSION_DAYS }}
          NOTES_METRICS_TOKEN: ${{ secrets.NOTES_METRICS_TOKEN }}
          NOTES_RECORD_LIMITS_ENABLED: ${{ secrets.NOTES_RECORD_LIMITS_ENABLED }}
          NOTES_RECORD_LIMIT_STORAGE_BYTES: ${{ secrets.NOTES_RECORD_LIMIT_STORAGE_BYTES }}
          NOTES_RECORD_LIMIT_SAFETY_RATIO: ${{ secrets.NOTES_RECORD_LIMIT_SAFETY_RATIO }}
          NOTES_RECORD_LIMIT_NOTE_BYTES: ${{ secrets.NOTES_RECORD_LIMIT_NOTE_BYTES }}
          NOTES_RECORD_LIMIT_NOTEBOOK_BYTES: ${{ secrets.NOTES_RECORD_LIMIT_NOTEBOOK_BYTES }}
          NOTES_SIGNUP_ALLOWED_EMAILS: ${{ secrets.NOTES_SIGNUP_ALLOWED_EMAILS }}
          AUTHOR_API_URL: ${{ secrets.AUTHOR_API_URL }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const required = [
            'TURSO_DATABASE_URL',
            'TURSO_AUTH_TOKEN',
            'NOTES_LOGIN_PASSWORD',
            'NOTES_SERVER_SECRET',
            'NOTES_METRICS_TOKEN'
          ];
          const optional = [
            'NOTES_AUTH_SESSION_DAYS',
            'NOTES_RECORD_LIMITS_ENABLED',
            'NOTES_RECORD_LIMIT_STORAGE_BYTES',
            'NOTES_RECORD_LIMIT_SAFETY_RATIO',
            'NOTES_RECORD_LIMIT_NOTE_BYTES',
            'NOTES_RECORD_LIMIT_NOTEBOOK_BYTES',
            'NOTES_SIGNUP_ALLOWED_EMAILS',
            'AUTHOR_API_URL'
          ];

          const secrets = {};
          for (const name of [...required, ...optional]) {
            if (process.env[name]) secrets[name] = process.env[name];
          }
          fs.writeFileSync('.worker-secrets.json', JSON.stringify(secrets));
          NODE

          trap 'rm -f .worker-secrets.json' EXIT
          ./node_modules/.bin/wrangler deploy --secrets-file .worker-secrets.json
